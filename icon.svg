<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110d"/>
      <stop offset="50%" stop-color="#0a0806"/>
      <stop offset="100%" stop-color="#19150f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer golden border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Center Shield / Seal -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Interlocking Wedding Rings / Seal -->
    <circle cx="-35" cy="-20" r="65" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <circle cx="35" cy="-20" r="65" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <!-- Diamond Sparkle -->
    <path d="M 0 -105 L 12 -80 L 37 -68 L 12 -56 L 0 -31 L -12 -56 L -37 -68 L -12 -80 Z" fill="url(#goldGrad)"/>
    <!-- Barcode / QR Grid Lines -->
    <rect x="-80" y="65" width="25" height="45" rx="6" fill="url(#goldGrad)"/>
    <rect x="-45" y="65" width="12" height="45" rx="4" fill="url(#goldGrad)"/>
    <rect x="-23" y="65" width="30" height="45" rx="6" fill="url(#goldGrad)"/>
    <rect x="17" y="65" width="12" height="45" rx="4" fill="url(#goldGrad)"/>
    <rect x="39" y="65" width="41" height="45" rx="6" fill="url(#goldGrad)"/>
  </g>
</svg>
