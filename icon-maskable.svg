<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110d"/>
      <stop offset="50%" stop-color="#070605"/>
      <stop offset="100%" stop-color="#19150f"/>
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed solid/gradient square background for safe Android maskable cropping -->
  <rect width="512" height="512" fill="url(#bgGradM)"/>

  <!-- Inner artwork kept safely within central 74% safe zone (13% padding on all sides) -->
  <g transform="translate(256, 256) scale(0.74)">
    <rect x="-200" y="-200" width="400" height="400" rx="88" fill="none" stroke="url(#goldGradM)" stroke-width="5" opacity="0.55"/>
    <g filter="url(#glowM)">
      <circle cx="-35" cy="-20" r="65" fill="none" stroke="url(#goldGradM)" stroke-width="14"/>
      <circle cx="35" cy="-20" r="65" fill="none" stroke="url(#goldGradM)" stroke-width="14"/>
      <path d="M 0 -105 L 12 -80 L 37 -68 L 12 -56 L 0 -31 L -12 -56 L -37 -68 L -12 -80 Z" fill="url(#goldGradM)"/>
      <rect x="-80" y="65" width="25" height="45" rx="6" fill="url(#goldGradM)"/>
      <rect x="-45" y="65" width="12" height="45" rx="4" fill="url(#goldGradM)"/>
      <rect x="-23" y="65" width="30" height="45" rx="6" fill="url(#goldGradM)"/>
      <rect x="17" y="65" width="12" height="45" rx="4" fill="url(#goldGradM)"/>
      <rect x="39" y="65" width="41" height="45" rx="6" fill="url(#goldGradM)"/>
    </g>
  </g>
</svg>
