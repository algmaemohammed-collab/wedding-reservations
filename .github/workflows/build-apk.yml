name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android project
        id: locate
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip archive: $ZIP_FILE — extracting clean project..."
            rm -rf _extracted
            mkdir -p _extracted
            unzip -q -o "$ZIP_FILE" -d _extracted
            PROJECT_FILE=$(find _extracted -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          else
            PROJECT_FILE=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "Files currently in repository:"
            find . -maxdepth 3 -not -path './.git*'
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project in: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-organizer-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
